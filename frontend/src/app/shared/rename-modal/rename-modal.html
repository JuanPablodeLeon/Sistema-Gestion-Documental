<div class="modal modal-open">
  <div class="modal-box max-w-md">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h3 class="text-lg font-extrabold">
          Renombrar {{ tipo() }}
        </h3>
        <p class="mt-1 break-all text-sm text-base-content/60">
          {{ currentName() }}
        </p>
      </div>
      <button
        type="button"
        class="btn btn-ghost btn-circle btn-sm"
        (click)="cerrar()"
        aria-label="Cerrar"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="mt-5">
      <label class="mb-1.5 block text-xs font-bold uppercase tracking-wide text-base-content/50">
        Nuevo nombre
      </label>
      <input
        type="text"
        class="input w-full"
        [value]="nombre()"
        [attr.maxlength]="tipo() === 'archivo' ? 200 : 150"
        (input)="nombre.set($any($event.target).value)"
        (keydown.enter)="submit()"
        placeholder="Escribe el nuevo nombre"
        autofocus
      />
      @if (tipo() === 'archivo') {
        <p class="mt-1 text-[11px] text-base-content/45">
          El archivo conserva la extensión .{{ tipoArchivo() }}.
        </p>
      }
    </div>

    @if (error()) {
      <div role="alert" class="alert alert-error mt-4 py-2 text-sm">
        <span>{{ error() }}</span>
      </div>
    }

    <div class="modal-action">
      <button type="button" class="btn btn-ghost btn-sm" (click)="cerrar()" [disabled]="saving()">
        Cancelar
      </button>
      <button type="button" class="btn btn-primary btn-sm" (click)="submit()" [disabled]="saving()">
        @if (saving()) {
          <span class="loading loading-spinner loading-xs"></span>
          Guardando...
        } @else {
          Guardar cambios
        }
      </button>
    </div>
  </div>
  <div class="modal-backdrop bg-black/60" (click)="cerrar()"></div>
</div>
